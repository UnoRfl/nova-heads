<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'">
<title>Nova StreamHub - Now Playing</title>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="music.css">
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%;user-select:none}
body{padding:14px;box-sizing:border-box;transition:opacity .3s}
#np{transform:scale(var(--s,1));transform-origin:0 0}
html,body{cursor:default}
#np .ctl button,#np .prog{cursor:pointer}
</style>
</head>
<body>
<div class="np hidden" id="np" data-theme="cyber">
  <div class="bg" id="bg"></div><div class="deco"></div>
  <div class="artw"><div class="art" id="art"></div><div class="scan"></div></div>
  <div class="info">
    <div class="top"><div class="eq"><i></i><i></i><i></i><i></i></div><span id="st">NOW PLAYING</span><span class="dev" id="dev"></span></div>
    <div class="ttl" id="tbox"><span id="title"></span></div>
    <div class="art2" id="artist"><span></span></div>
    <div class="row"><div class="prog" id="prog"><i id="bar"></i></div><span class="tm" id="tm"></span></div>
    <div class="row ctlrow">
      <div class="ctl">
        <button data-c="shuffle" title="Shuffle"><svg viewBox="0 0 16 16"><path d="M11 2l3 2.5L11 7V5.3c-1.6.1-2.6 1-3.6 2.4l-.6.8.6.8c1 1.4 2 2.3 3.6 2.4V10l3 2.5L11 15v-1.8c-2.4-.1-3.8-1.4-5-3.1-1.2 1.7-2.6 3-5 3.1V11.6c1.6-.1 2.6-1 3.6-2.4l.6-.8-.6-.8C3.6 6.2 2.6 5.3 1 5.2V3.6c2.4.1 3.8 1.4 5 3.1C7.2 5 8.6 3.7 11 3.6z"/></svg></button>
        <button data-c="previous" title="Previous"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
        <button data-c="toggle" class="pp" title="Play / pause"><svg viewBox="0 0 16 16"><path id="ppath" d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
        <button data-c="next" title="Next"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="err" id="err"></div>
</div>
<script src="hud.js"></script>
<script src="music.js"></script>
</body>
</html>
