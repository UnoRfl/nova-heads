<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
<title>Nova Heads</title>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="themes.css">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%;cursor:none}
  body{padding:40px 24px;box-sizing:border-box;display:flex;flex-direction:column}
  body.bottom{justify-content:flex-end}
  .hud.bottom{transform-origin:0 100%}
  .hud.right.bottom{transform-origin:100% 100%}
  #glass{position:fixed;inset:0;pointer-events:none;display:none}
</style>
</head>
<body>
<canvas id="glass"></canvas>
<div id="hud"></div>
<script src="hud.js"></script>
<script>
const hud = createHud(document.getElementById("hud"), { sound: true });
let cfg = {};

// ---------------------------------------------------------------- optional REAL glass
// Captures the screen (the overlay hides itself from capture), and paints a heavily blurred copy of
// what's behind each plate/frame/header, so the glass themes show the real game through them.
const glass = document.getElementById("glass"), gctx = glass.getContext("2d");
const small = document.createElement("canvas"), sctx = small.getContext("2d");
let video = null, stream = null, raf = 0;
async function startGlass() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 24 }, audio: false });
    video = document.createElement("video");
    video.muted = true; video.srcObject = stream; await video.play();
    glass.style.display = "block";
    loop();
  } catch (e) { console.warn("real glass unavailable", e); stopGlass(); }
}
function stopGlass() {
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = video = null;
  glass.style.display = "none";
}
function loop() {
  raf = requestAnimationFrame(loop);
  if (!video || video.readyState < 2) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (glass.width !== W * dpr) { glass.width = W * dpr; glass.height = H * dpr; }
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, W, H);
  const win = cfg._win || { x: 0, y: 0, sf: 1 };
  const vx = video.videoWidth / (cfg._screen ? cfg._screen.w : screen.width);
  for (const el of document.querySelectorAll(".hud .plate, .hud .frame, .hud .hdr")) {
    const r = el.getBoundingClientRect();
    if (r.width < 2 || el.closest(".row.gone")) continue;
    const pad = 14;
    const sx = (win.x + r.left - pad) * vx, sy = (win.y + r.top - pad) * vx, sw = (r.width + pad * 2) * vx, sh = (r.height + pad * 2) * vx;
    // cheap strong blur: shrink to ~1/8 then scale back up with smoothing
    small.width = Math.max(2, Math.round(sw / 8)); small.height = Math.max(2, Math.round(sh / 8));
    sctx.drawImage(video, sx, sy, sw, sh, 0, 0, small.width, small.height);
    gctx.save();
    const rad = parseFloat(getComputedStyle(el).borderRadius) || 0;
    gctx.beginPath(); gctx.roundRect ? gctx.roundRect(r.left, r.top, r.width, r.height, rad) : gctx.rect(r.left, r.top, r.width, r.height); gctx.clip();
    gctx.imageSmoothingQuality = "high";
    gctx.drawImage(small, r.left - pad, r.top - pad, r.width + pad * 2, r.height + pad * 2);
    gctx.restore();
  }
}

window.nova.onConfig((c) => {
  cfg = c;
  hud.setConfig(c);
  const bottom = c._valign === "bottom";
  document.body.classList.toggle("bottom", bottom);
  document.getElementById("hud").classList.toggle("bottom", bottom);
  if (c.real_glass) startGlass(); else stopGlass();
});
window.nova.onState((s) => hud.render(s));
window.nova.onToast((t) => hud.toast(t));
window.nova.ready();
</script>
</body>
</html>
